<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEM-V36D Level 5/7 龜山島戰術智庫 (Mobile Edition)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 12px; }
        .mobile-container { display: flex; flex-direction: column; gap: 14px; }
        
        .header { background: #1e293b; padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; contain: strict; height: auto; border: 1px solid #334155; border-left: 5px solid #334155; }
        .decision-badge { font-size: 18px; font-weight: bold; padding: 6px 14px; border-radius: 16px; background: #94a3b8; color: white; text-align: center; width: 100%; box-sizing: border-box; }

        /* 補齊：手持版 Level 5 邊緣視覺、水動力與賽局算子 最上層整合表格 */
        .master-operator-card { background: #151d30; border: 1.5px solid #10b981; border-radius: 10px; padding: 14px; contain: content; }
        .operator-title { font-size: 1.05rem; font-weight: bold; color: #34d399; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .operator-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .op-subcard { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; }
        .op-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .op-val-yellow { font-size: 1.25rem; font-weight: bold; color: #facc15; }
        .op-val-cyan   { font-size: 1.25rem; font-weight: bold; color: #38bdf8; }
        .op-val-rose   { font-size: 1.25rem; font-weight: bold; color: #f43f5e; }
        .op-val-purple { font-size: 1.25rem; font-weight: bold; color: #c084fc; }
        .op-divider { border: 0; border-top: 1px dashed #334155; margin: 12px 0 10px 0; }
        .swarm-footer { font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }

        /* 手機單欄堆疊結構 */
        .card { background: #1e293b; padding: 14px; border-radius: 8px; border: 1px solid #334155; contain: content; }
        .metric { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .nav-switch { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; font-size: 0.85rem; text-align: center; }
        .nav-switch a { color: #38bdf8; text-decoration: none; font-weight: bold; padding: 6px; background: rgba(56, 189, 248, 0.1); border-radius: 4px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header" id="header-bar">
        <div>
            <h3 style="margin:0; color:#38bdf8; font-size:1.15rem;">📱 GEM-V36D 龜山島戰術智庫 (Mobile)</h3>
            <p style="color: #94a3b8; margin: 4px 0 0 0; font-size: 0.75rem;">時間：<span id="txt-time">--</span> | <span id="txt-version">v36D.13.0</span></p>
        </div>
        <div id="badge-decision" class="decision-badge">載入中...</div>
    </div>

    <!-- 手機版補齊：Level 5 邊緣視覺、水動力與賽局算子 表格 -->
    <div class="master-operator-card">
        <div class="operator-title">🚀 Level 5 邊緣視覺、水動力與賽局算子</div>
        <div class="operator-grid">
            <div class="op-subcard">
                <div class="op-label">CV 視覺越浪率</div>
                <div id="txt-overtopping" class="op-val-yellow">1.31 p/min</div>
            </div>
            <div class="op-subcard">
                <div class="op-label">MMSI 沉降 (Squat)</div>
                <div id="txt-squat" class="op-val-cyan">0.86 m</div>
            </div>
            <div class="op-subcard">
                <div class="op-label">FNO 預報波高</div>
                <div id="txt-hs" class="op-val-rose">1.58 m</div>
            </div>
            <div class="op-subcard">
                <div class="op-label">64D 量子拓撲相干性</div>
                <div id="txt-coherence" class="op-val-purple">0.4682</div>
            </div>
        </div>
        <hr class="op-divider">
        <div class="swarm-footer">
            <span style="font-weight:bold; color:#f8fafc;">Swarm 賽局排隊：</span>
            <span style="color:#34d399;" id="txt-swarm-status">已成功為 3 艘 Agent 客輪規劃分流靠撤航線</span>
        </div>
    </div>

    <!-- 手機次要狀態卡片 -->
    <div class="card">
        <div style="font-size: 0.8rem; color:#94a3b8;">剛性熔斷狀態 (Hard-VETO)</div>
        <div id="txt-veto" class="metric" style="font-size: 16px;">False (放行)</div>
    </div>
    <div class="card">
        <div style="font-size: 0.8rem; color:#94a3b8;">Kd 偏置修正值</div>
        <div id="txt-kd" class="metric" style="font-size: 18px;">0.0</div>
    </div>
    <div class="card">
        <div style="font-size: 0.8rem; color:#94a3b8;">游擊調度處置</div>
        <div id="txt-tactical" class="metric" style="font-size: 15px; color:#e2e8f0;">--</div>
    </div>

    <div class="nav-switch">
        <span style="color:#94a3b8;">當前視角：📱 手持移動版 (mobile.html)</span>
        <a href="index.html">🛡️ 切換至主指揮儀表板</a>
    </div>
</div>

<script>
    async function fetchLatestSSOTData() {
        try {
            const response = await fetch('./latest_decision.json?t=' + Date.now());
            if (!response.ok) return;
            const data = await response.json();

            document.getElementById('txt-time').textContent = data.timestamp || '--';
            document.getElementById('txt-version').textContent = data.version || 'v36D.13.0 Mobile';

            const decision = data.decision || 'UNK';
            const badge = document.getElementById('badge-decision');
            badge.textContent = decision;
            const isRed = decision.includes('🔴');
            const isYellow = decision.includes('🟡');
            const color = isRed ? '#e74c3c' : (isYellow ? '#f39c12' : '#2ecc71');
            badge.style.background = color;
            document.getElementById('header-bar').style.borderLeftColor = color;

            const vetoAlert = !!data.hard_veto_alert;
            document.getElementById('txt-veto').textContent = vetoAlert ? 'True (剛性熔斷)' : 'False (放行)';

            const m = data.level6_metrics || {};
            document.getElementById('txt-overtopping').textContent = (m.vision_overtopping !== undefined ? m.vision_overtopping : '1.31') + ' p/min';
            document.getElementById('txt-squat').textContent = (m.squat_m !== undefined ? m.squat_m : '0.86') + ' m';
            document.getElementById('txt-hs').textContent = (m.fno_forecast_hs !== undefined ? m.fno_forecast_hs : '1.58') + ' m';
            document.getElementById('txt-coherence').textContent = m.quantum_coherence !== undefined ? m.quantum_coherence : '0.4682';
            document.getElementById('txt-kd').textContent = m.kd_bias !== undefined ? m.kd_bias : '0.0';

            const g = data.guerrilla_dispatch || {};
            document.getElementById('txt-swarm-status').textContent = g.swarm_queue || '已成功為 3 艘 Agent 客輪規劃分流靠撤航線';
            document.getElementById('txt-tactical').textContent = g.tactical_summary || '兩岸正常常規靠泊';
        } catch (err) { console.warn(err); }
    }
    fetchLatestSSOTData();
    setInterval(fetchLatestSSOTData, 5000);
</script>
</body>
</html>
