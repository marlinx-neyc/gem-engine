<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEM Engine Mobile V36D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100%; min-height: 100dvh; background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .mobile-container { width: 100%; min-height: 100dvh; padding: 12px; }
        .card-mob { background: #1e293b; border-radius: 8px; padding: 12px; border: 1px solid #334155; margin-bottom: 10px; color: #f8fafc; }
        .banner-mob { border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; font-size: 13px; line-height: 1.4; text-align: center; }
        .stale-mob { display: none; background: #ef4444; color: #ffffff; padding: 8px; text-align: center; font-weight: bold; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
        .item-box { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
        .badge-veto-m { background: #ef4444; color: #fff; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .badge-pass-m { background: #10b981; color: #fff; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .table-full { width: 100%; border-collapse: collapse; font-size: 11px; color: #cbd5e1; }
        .table-full td { padding: 4px 2px; text-align: left; }
        .live-dot-blue { display: inline-block; width: 8px; height: 8px; background-color: #3b82f6; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #3b82f6; animation: pulseBlue 1.5s infinite; }
        @keyframes pulseBlue { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="card-mob" style="display:flex; justify-content:space-between; align-items:center;">
            <div><span class="live-dot-blue"></span><strong style="color:#3b82f6; font-size:12px;">SSOT 雙生連線中</strong></div>
            <div style="font-size:11px; color:#94a3b8;">通訊: <span id="mobCommCount" style="color:#f8fafc; font-weight:bold;">0</span> 次 | <span id="mobSecAgo">更新: 0 秒前</span></div>
        </div>
        <div id="staleAlertMob" class="stale-mob">🔴 數據過期 (READ_ONLY_BACKUP)</div>
        <div id="vetoBannerMob" class="banner-mob">🔄 戰術決策載入中...</div>
        <div class="card-mob">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <strong style="color:#38bdf8; font-size:12px;">即時海象與物理防線 (PINN)</strong>
                <span id="mobileTimestamp" style="font-size:10px; color:#94a3b8;">載入中...</span>
            </div>
            <div class="grid-2">
                <div class="item-box"><div style="color:#94a3b8; margin-bottom:2px;">Hs (<=1.20m)</div><div style="display:flex; justify-content:space-between; align-items:center;"><span id="m_hs" style="color:#facc15; font-weight:bold;">-</span><span id="m_stat_hs" class="badge-pass-m">-</span></div></div>
                <div class="item-box"><div style="color:#94a3b8; margin-bottom:2px;">Wind (<=10.8m/s)</div><div style="display:flex; justify-content:space-between; align-items:center;"><span id="m_w" style="color:#facc15; font-weight:bold;">-</span><span id="m_stat_w" class="badge-pass-m">-</span></div></div>
                <div class="item-box"><div style="color:#94a3b8; margin-bottom:2px;">UKC (>=1.50m)</div><div style="display:flex; justify-content:space-between; align-items:center;"><span id="m_ukc" style="color:#facc15; font-weight:bold;">-</span><span id="m_stat_ukc" class="badge-pass-m">-</span></div></div>
                <div class="item-box"><div style="color:#94a3b8; margin-bottom:2px;">FB (>=0.50m)</div><div style="display:flex; justify-content:space-between; align-items:center;"><span id="m_fb" style="color:#facc15; font-weight:bold;">-</span><span id="m_stat_fb" class="badge-pass-m">-</span></div></div>
            </div>
        </div>
        <div class="card-mob" style="border: 1px solid #64748b;">
            <strong style="color:#c084fc; font-size:12px; display:block; margin-bottom:6px;">🧠 雙生大腦認知與影子學習</strong>
            <div class="grid-2" style="font-size:11px; line-height:1.5;">
                <div class="item-box"><div style="color:#94a3b8;">歷史 20 年同構數</div><div id="mob_match_cases" style="color:#38bdf8; font-weight:bold;">-</div><div style="color:#94a3b8; margin-top:2px;">先驗封島率</div><div id="mob_prior_rate" style="color:#ef4444; font-weight:bold;">-</div></div>
                <div class="item-box"><div style="color:#94a3b8;">RL 大腦直覺</div><div id="mob_rl_raw" style="color:#cbd5e1; font-weight:bold;">-</div><div style="color:#94a3b8; margin-top:2px;">物理/認知狀態</div><div id="mob_rl_conflict" style="color:#10b981; font-weight:bold;">-</div></div>
            </div>
        </div>
    </div>
    <script>
        let lastUpdateMob = Date.now();
        let mobCommCounter = 0;
        window.onSSOTDataReceived = function(data) {
            if (!data) return;
            lastUpdateMob = Date.now();
            mobCommCounter++;
            document.getElementById('mobCommCount').innerText = mobCommCounter;
            document.getElementById('staleAlertMob').style.display = 'none';
            let ts = data.timestamp || (new Date().toLocaleString('zh-TW', {hour12: false}) + ' CST');
            document.getElementById('mobileTimestamp').innerText = ts;
            let bannerEl = document.getElementById('vetoBannerMob');
            if (data.decision_code === "Q4_DISASTER") {
                bannerEl.style.background = "rgba(239, 68, 68, 0.9)";
                bannerEl.style.color = "#ffffff";
                bannerEl.innerText = "⚠️ " + (data.tier0_reason || "觸發 Tier-0 災難級別，全線強制封島！");
            } else {
                let isVeto = data.physics_metrics && data.physics_metrics.has_veto;
                bannerEl.style.background = isVeto ? "rgba(239, 68, 68, 0.2)" : "rgba(16, 185, 129, 0.2)";
                bannerEl.style.color = isVeto ? "#fca5a5" : "#6ee7b7";
                let codeText = data.decision_code || (isVeto ? 'Q4' : 'Q1');
                bannerEl.innerText = (isVeto ? "🔴 " : "🟢 ") + codeText + " 模式 - " + (isVeto ? '觸發 VETO 剛性封鎖' : '許可巡航靠泊');
            }
            if (data.physics_metrics) {
                let p = data.physics_metrics;
                document.getElementById('m_hs').innerText = (p.hs_pier_m !== undefined ? p.hs_pier_m : '-') + 'm';
                document.getElementById('m_stat_hs').innerText = p.hs_pier_m > 1.20 ? 'VETO' : 'PASS';
                document.getElementById('m_stat_hs').className = p.hs_pier_m > 1.20 ? 'badge-veto-m' : 'badge-pass-m';
                document.getElementById('m_w').innerText = (p.w_local_ms !== undefined ? p.w_local_ms : '-') + 'm/s';
                document.getElementById('m_stat_w').innerText = p.w_local_ms > 10.80 ? 'VETO' : 'PASS';
                document.getElementById('m_stat_w').className = p.w_local_ms > 10.80 ? 'badge-veto-m' : 'badge-pass-m';
                document.getElementById('m_ukc').innerText = (p.ukc_m !== undefined ? p.ukc_m : '-') + 'm';
                document.getElementById('m_stat_ukc').innerText = p.ukc_m < 1.50 ? 'VETO' : 'PASS';
                document.getElementById('m_stat_ukc').className = p.ukc_m < 1.50 ? 'badge-veto-m' : 'badge-pass-m';
                document.getElementById('m_fb').innerText = (p.fb_pier_m !== undefined ? p.fb_pier_m : '-') + 'm';
                document.getElementById('m_stat_fb').innerText = p.fb_pier_m < 0.50 ? 'VETO' : 'PASS';
                document.getElementById('m_stat_fb').className = p.fb_pier_m < 0.50 ? 'badge-veto-m' : 'badge-pass-m';
            }
            if (data.pattern_match) {
                document.getElementById('mob_match_cases').innerText = data.pattern_match.matched_cases + ' 筆';
                document.getElementById('mob_prior_rate').innerText = ((data.pattern_match.historical_closure_rate || 0) * 100).toFixed(1) + '%';
            }
            if (data.rl_feedback_status) {
                document.getElementById('mob_rl_raw').innerText = data.rl_feedback_status.raw_rl_prediction || '-';
                document.getElementById('mob_rl_conflict').innerHTML = data.rl_feedback_status.has_contradiction ? '<span style="color:#ef4444;">🚨 矛盾</span>' : '<span style="color:#10b981;">共識</span>';
            }
        };
        async function fetchSSOTData() {
            try {
                const response = await fetch('./latest_decision.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                if (typeof window.onSSOTDataReceived === "function") window.onSSOTDataReceived(data);
            } catch (err) { console.warn("遙測讀取失敗:", err); }
        }
        document.addEventListener("DOMContentLoaded", () => { fetchSSOTData(); setInterval(fetchSSOTData, 3000); });
    </script>
</body>
</html>
