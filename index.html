<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌊 GEM Engine v66.0 龜山島全域戰術指揮中樞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #080e1a;
            --card-bg: #111c2e;
            --card-border: #1e2d4a;
            --accent-blue: #38bdf8;
            --status-pass: #10b981;
            --status-warn: #f59e0b;
            --status-danger: #ef4444;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: #f8fafc; padding: 6px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px; margin-bottom: 6px; }
        .badge-veto { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid var(--status-danger); }
        .badge-pass { background: rgba(16, 185, 129, 0.25); color: #86efac; border: 1px solid var(--status-pass); }
        .badge-yellow { background: rgba(250, 204, 21, 0.25); color: #facc15; border: 1px solid #facc15; }
    </style>
</head>
<body class="w-full max-w-[1700px] mx-auto">

    <!-- 🌀 颱風態勢專區與 GEM 應變比對 (動態 API 多手連動) -->
    <details class="card border-[#ef4444] bg-[#180d1a]/90" open id="detailsTyphoonZone">
        <summary class="card-header !text-red-400 font-bold flex justify-between cursor-pointer">
            <span class="flex items-center gap-1">🌀 颱風態勢專區與 GEM 應變比對 (CWA + TDX 多手 API 即時實證)</span>
            <span class="badge badge-veto text-[9px]" id="cwaIntensityTag">一般海象</span>
        </summary>

        <div class="pt-2 border-t border-red-500/30 mt-1 space-y-2 text-[9px]">
            <!-- 交通部 TDX 即時航務狀態列 -->
            <div class="bg-blue-950/60 p-1.5 rounded border border-blue-500/40 flex justify-between items-center text-[8.5px]">
                <span class="text-sky-300 font-bold">🚢 交通部 TDX 航務即時狀態：</span>
                <span class="text-amber-300 font-mono font-bold" id="tdxStatusText">TDX 未連動 (使用氣象預警)</span>
            </div>

            <div class="bg-black/60 p-2 rounded border border-red-500/40">
                <div class="font-extrabold text-red-300 border-b border-red-500/30 pb-1 mb-1.5 flex justify-between items-center">
                    <span class="text-[10px]">🌀 中央氣象署 (CWA) 即時颱風動態</span>
                    <span class="badge badge-veto text-[7.5px]" id="cwaAlertStatus">未發布警報</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 font-mono text-[8.5px]">
                    <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700">
                        <span class="text-slate-400 block text-[7.5px]">颱風名稱 / 編號</span>
                        <b class="text-white text-[9.5px]" id="cwaTyphoonName">無作用中颱風</b>
                    </div>
                    <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700">
                        <span class="text-slate-400 block text-[7.5px]">中心氣壓 / 風速</span>
                        <b class="text-amber-300 text-[9.5px]" id="cwaPressureWind">1012 hPa | 4.2 m/s</b>
                    </div>
                    <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700">
                        <span class="text-slate-400 block text-[7.5px]">暴風半徑 (7級/10級)</span>
                        <b class="text-sky-300 text-[9.5px]" id="cwaRadius">--- km / --- km</b>
                    </div>
                    <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700">
                        <span class="text-slate-400 block text-[7.5px]">移速 / 移向</span>
                        <b class="text-emerald-300 text-[9.5px]" id="cwaMovement">靜止 / 0 km/h</b>
                    </div>
                    <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700">
                        <span class="text-slate-400 block text-[7.5px]">距龜山島實時距離</span>
                        <b class="text-red-400 text-[9.5px]" id="cwaDistance">無侵襲威脅</b>
                    </div>
                    <div class="bg-red-950/60 p-1.5 rounded border border-red-500/50">
                        <span class="text-red-300 block text-[7.5px]">戰術影響值 (Impact Index)</span>
                        <b class="text-yellow-300 text-[9.5px]" id="cwaImpact">影響值：12.0 / 100</b>
                    </div>
                </div>
            </div>
        </div>
    </details>

    <!-- 前端 12 秒 SSOT 心跳與滾動修正 JS -->
    <script>
    (function() {
        async function pollLatestDecision() {
            try {
                const res = await fetch(`latest_decision.json?t=${new Date().getTime()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.typhoon_live) {
                        const t = data.typhoon_live;
                        document.getElementById('cwaTyphoonName').textContent = t.name;
                        document.getElementById('cwaPressureWind').textContent = t.pressure_wind;
                        document.getElementById('cwaRadius').textContent = t.radius;
                        document.getElementById('cwaMovement').textContent = t.movement;
                        document.getElementById('cwaDistance').textContent = t.distance_text;
                        document.getElementById('cwaImpact').textContent = `影響值：${t.impact_index} / 100`;
                        document.getElementById('cwaIntensityTag').textContent = t.intensity;
                        document.getElementById('cwaAlertStatus').textContent = t.alert_status;
                        if (t.tdx_status) {
                            document.getElementById('tdxStatusText').textContent = t.tdx_status;
                        }
                    }
                }
            } catch (e) {
                console.warn("SSOT Polling skip:", e);
            }
        }
        setInterval(pollLatestDecision, 12000);
    })();
    </script>
</body>
</html>
