<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEM Engine V36D - Master SSOT Control Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background-color: #0b1120; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #appFrame {
            width: 100%; height: 100%; border: none; display: block;
        }
    </style>
</head>
<body>
    <iframe id="appFrame" src="about:blank"></iframe>

    <script>
        let currentSSOTData = null;
        let lastFetchTime = Date.now();

        // 1. 裝置自動路由判斷 (< 768px 自動載入 mobile.html，否則載入 desktop.html)
        function getTargetTargetUrl() {
            return window.innerWidth < 768 ? 'mobile.html' : 'desktop.html';
        }

        function initFrameRouting() {
            const frame = document.getElementById('appFrame');
            const targetUrl = getTargetTargetUrl();
            if (!frame.src || !frame.src.endsWith(targetUrl)) {
                frame.src = targetUrl;
            }
        }

        // 2. 視窗大小改變時自適應切換視角
        window.addEventListener('resize', () => {
            initFrameRouting();
        });

        // 3. 全局 3 秒 Polling 讀取 latest_decision.json 並向子視窗廣播
        async function pollSSOTData() {
            try {
                const response = await fetch('./latest_decision.json?t=' + Date.now());
                if (!response.ok) throw new Error("HTTP " + response.status);
                currentSSOTData = await response.json();
                lastFetchTime = Date.now();

                // 廣播給子視窗 (iframe)
                const frame = document.getElementById('appFrame');
                if (frame && frame.contentWindow) {
                    if (typeof frame.contentWindow.onSSOTDataReceived === 'function') {
                        frame.contentWindow.onSSOTDataReceived(currentSSOTData);
                    }
                    frame.contentWindow.postMessage({ type: 'SSOT_SYNC', data: currentSSOTData }, '*');
                }
            } catch (err) {
                console.warn("[Master SSOT Polling Error]:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initFrameRouting();
            pollSSOTData();
            setInterval(pollSSOTData, 3000);
        });
    </script>
</body>
</html>
