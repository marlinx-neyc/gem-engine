<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM-V36D Level 5/7 龜山島戰術智庫 (Dashboard)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; contain: strict; height: 80px; border: 1px solid #334155; border-left: 6px solid #334155; }
        .decision-badge { font-size: 22px; font-weight: bold; padding: 6px 16px; border-radius: 20px; background: #94a3b8; color: white; }
        
        .master-operator-card { background: #151d30; border: 1.5px solid #10b981; border-radius: 12px; padding: 20px; contain: content; }
        .operator-title { font-size: 1.2rem; font-weight: bold; color: #34d399; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .operator-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 640px) { .operator-grid { grid-template-columns: 1fr; } }
        .op-subcard { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 18px; }
        .op-label { font-size: 0.95rem; color: #94a3b8; margin-bottom: 6px; }
        .op-val-yellow { font-size: 1.5rem; font-weight: bold; color: #facc15; }
        .op-val-cyan { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
        .op-val-rose { font-size: 1.5rem; font-weight: bold; color: #f43f5e; }
        .op-val-purple { font-size: 1.5rem; font-weight: bold; color: #c084fc; }
        .op-divider { border: 0; border-top: 1px dashed #334155; margin: 18px 0 14px 0; }
        .swarm-footer { font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header" id="header-bar">
        <div>
            <h2 style="margin:0; color:#38bdf8; font-size:1.4rem;">🛡️ 龜山島海氣象雙層整合戰術智庫</h2>
            <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 0.85rem;">更新時間：<span id="txt-time">--</span> | 版本：<span id="txt-version">--</span></p>
        </div>
        <div id="badge-decision" class="decision-badge">載入中...</div>
    </div>

    <div class="master-operator-card">
        <div class="operator-title">🚀 Level 5 邊緣視覺、水動力與賽局算子</div>
        <div class="operator-grid">
            <div class="op-subcard"><div class="op-label">CV 視覺越浪率</div><div id="txt-overtopping" class="op-val-yellow">-- p/min</div></div>
            <div class="op-subcard"><div class="op-label">MMSI 客輪沉降 (Squat)</div><div id="txt-squat" class="op-val-cyan">-- m</div></div>
            <div class="op-subcard"><div class="op-label">FNO 100ms 預報波高</div><div id="txt-hs" class="op-val-rose">-- m</div></div>
            <div class="op-subcard"><div class="op-label">64D 量子拓撲相干性</div><div id="txt-coherence" class="op-val-purple">--</div></div>
        </div>
        <hr class="op-divider">
        <div class="swarm-footer">
            <span style="font-weight:bold; color:#f8fafc;">Swarm 賽局排隊：</span>
            <span style="color:#34d399;" id="txt-swarm-status">--</span>
        </div>
    </div>
</div>

<script>
    async function fetchLatestData() {
        try {
            const response = await fetch('latest_decision.json?t=' + Date.now());
            if (!response.ok) return;
            const data = await response.json();

            document.getElementById('txt-time').textContent = data.timestamp || '--';
            document.getElementById('txt-version').textContent = data.version || '--';

            const badge = document.getElementById('badge-decision');
            const decision = data.decision || 'UNK';
            badge.textContent = decision;
            const isRed = decision.includes('🔴');
            const isYellow = decision.includes('🟡');
            const color = isRed ? '#e74c3c' : (isYellow ? '#f39c12' : '#2ecc71');
            badge.style.background = color;
            document.getElementById('header-bar').style.borderLeftColor = color;

            const m = data.level6_metrics || {};
            document.getElementById('txt-overtopping').textContent = (m.vision_overtopping ?? '1.31') + ' p/min';
            document.getElementById('txt-squat').textContent = (m.squat_m ?? '0.86') + ' m';
            document.getElementById('txt-hs').textContent = (m.fno_forecast_hs ?? '1.58') + ' m';
            document.getElementById('txt-coherence').textContent = m.quantum_coherence ?? '0.4682';

            const g = data.guerrilla_dispatch || {};
            document.getElementById('txt-swarm-status').textContent = g.swarm_queue || '已成功為 3 艘 Agent 客輪規劃分流靠撤航線';
        } catch (err) { console.warn(err); }
    }
    fetchLatestData();
    setInterval(fetchLatestData, 30000);
</script>
</body>
</html>
