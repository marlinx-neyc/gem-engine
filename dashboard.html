<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM-V36D Level 7 龜山島海氣象雙層整合戰情中心</title>
    <style>
        /* 幾何座標鎖定：contain: strict / content 徹底隔絕幾何重算 (CLS = 0) */
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .header { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; contain: strict; height: 80px; border-left: 6px solid #334155; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; contain: content; }
        .metric { font-size: 28px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        .decision-badge { font-size: 22px; font-weight: bold; padding: 6px 16px; border-radius: 20px; background: #94a3b8; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>龜山島海氣象雙層整合戰情中心 (GEM-V36D Master)</h2>
            <p style="color: #94a3b8; margin: 0;">更新時間：<span id="txt-time">--</span> | 版本：<span id="txt-version">--</span></p>
        </div>
        <div id="badge-decision" class="decision-badge">讀取中...</div>
    </div>
    
    <div class="card-grid">
        <div class="card"><h3>微觀物理浪高</h3><div id="txt-hs" class="metric">-- m</div><p>否決狀態：<span id="txt-veto">--</span></p></div>
        <div class="card"><h3>越浪率估算</h3><div id="txt-overtopping" class="metric">-- p/min</div><p>Kd 修正：<span id="txt-kd">--</span></p></div>
        <div class="card"><h3>64D 量子拓撲共振</h3><div id="txt-coherence" class="metric">--</div><p>歷史共振吻合率：<span id="txt-consensus">--</span>%</p></div>
        <div class="card"><h3>游擊調度戰術</h3><div class="metric">Swarm 自動化</div><p id="txt-tactical">--</p></div>
    </div>

    <script>
        // 每 30 秒向 latest_decision.json 抓取數據，僅更新純 DOM 文字節點 (node.textContent)
        async function fetchLatestSSOTData() {
            try {
                const response = await fetch('latest_decision.json?t=' + Date.now());
                if (!response.ok) return;
                const data = await response.json();

                document.getElementById('txt-time').textContent = data.timestamp || '--';
                document.getElementById('txt-version').textContent = data.version || '--';

                const badge = document.getElementById('badge-decision');
                const decision = data.decision || 'UNK';
                badge.textContent = decision;
                badge.style.background = decision.includes('🔴') ? '#e74c3c' : (decision.includes('🟡') ? '#f39c12' : '#2ecc71');

                const m = data.level6_metrics || {};
                document.getElementById('txt-hs').textContent = (m.fno_forecast_hs !== undefined ? m.fno_forecast_hs : '--') + ' m';
                document.getElementById('txt-veto').textContent = data.hard_veto_alert ? 'True (剛性熔斷)' : 'False (放行)';
                document.getElementById('txt-overtopping').textContent = (m.vision_overtopping !== undefined ? m.vision_overtopping : '0.0') + ' p/min';
                document.getElementById('txt-kd').textContent = m.kd_bias !== undefined ? m.kd_bias : '0.0';
                document.getElementById('txt-coherence').textContent = m.quantum_coherence !== undefined ? m.quantum_coherence : '--';
                
                const q = data.qimen_macro_consensus || {};
                document.getElementById('txt-consensus').textContent = q.consensus_rate_pct !== undefined ? q.consensus_rate_pct : '100';

                const g = data.guerrilla_dispatch || {};
                document.getElementById('txt-tactical').textContent = g.tactical_summary || '正常營運';
            } catch (err) {
                console.warn('SSOT 數據更新暫緩:', err);
            }
        }

        fetchLatestSSOTData();
        setInterval(fetchLatestSSOTData, 30000); // 靜態輪詢
    </script>
</body>
</html>
