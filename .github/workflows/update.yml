name: GEM Engine 3-Times-Daily Sync (CST 07:30 / 11:30 / 16:30)

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  scheduled-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 numpy

      - name: Run main orchestrator
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python main_orchestrator.py

      - name: Auto Push updates to GitHub
        run: |
          git config --global user.name "GEM Engine Bot"
          git config --global user.email "bot@gem-engine.local"
          git add data/live_status.json index.html web/index.html DASHBOARD_SPEC.md
          git diff-index --quiet HEAD || git commit -m "🤖 [Auto Cron] 實船駐島行為與即時海氣象動態修正同步"
          git push
