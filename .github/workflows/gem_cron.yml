name: GEM Engine Autonomous Cron Workflow

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 授權 github-actions[bot] 具備寫入與 Push 權限
permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Execute Master Orchestrator Pipeline
        run: |
          python main_orchestrator.py

      - name: Commit and Push SSOT Decision Payload Only
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_decision.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-update SSOT decision payload [skip ci]"
            git pull --rebase origin main
            git push
          fi
