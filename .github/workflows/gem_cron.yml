name: GEM Engine Cron Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘定時執行
  workflow_dispatch:       # 支援手動觸發
  repository_dispatch:     # 支援外部 Cron/Cloudflare Worker 觸發

permissions:
  contents: write          # 授權寫入 latest_decision.json 與 dashboard.html

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          BIGGIS_API_KEY: ${{ secrets.BIGGIS_API_KEY }}
        run: python main_orchestrator.py

      - name: Commit & Push SSOT Outputs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_decision.json dashboard.html KB_20260904_ESE_OVERTOPPING.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sync SSOT latest_decision [skip ci]" && git push)
