name: GEM Engine Autonomous Cron Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic numpy gymnasium

      # 🔄【動態自動化】每次排程啟動時，自動向 Google 申請最新 Access Token
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Run AI Orchestrator Single Pipeline
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python main_orchestrator.py --single-run
