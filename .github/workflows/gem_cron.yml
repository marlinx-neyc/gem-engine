name: GEM Engine Autonomous Cron Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic numpy gymnasium

      - name: Run AI Orchestrator Single Pipeline
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          if [ -f "main_orchestrator.py" ]; then
            python main_orchestrator.py --single-run
          elif [ -f "main.py" ]; then
            python main.py --single-run
          fi
