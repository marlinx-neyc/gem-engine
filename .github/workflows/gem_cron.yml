name: GEM Engine Autonomous Cron Workflow
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pydantic

      - name: Run Main Inference Engine
        run: python main.py

      - name: Commit and Push Decision JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_decision.json
          git diff-index --quiet HEAD || git commit -m "🤖 [Auto Update] GEM 36D Tactical Decision JSON"
          git push
