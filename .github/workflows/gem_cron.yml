name: GEM Engine Dual-Source Assimilation

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install httpx numpy torch nest_asyncio

      - name: Execute Master Pipeline
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python main_orchestrator.py

      - name: Commit & Push SSOT Outputs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add latest_decision.json
          git diff-index --quiet HEAD || git commit -m "Auto-assimilate TDX & CWA data stream [skip ci]"
          git push
