name: GEM Engine Cron Pipeline

on:
  schedule:
    # 每日於 11:00 與 16:00 CST (UTC 03:00 與 08:00) 準時觸發
    - cron: '0 3,8 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 剛性授權寫入 Repository contents

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整抓取 Commit 歷史，防範 branch diverged

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy requests pydantic truststore

      - name: Execute Master Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          BIGGIS_API_KEY: ${{ secrets.BIGGIS_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main_orchestrator.py

      - name: Commit & Push SSOT Outputs & Model Weights
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync SSOT & update latest model weights [skip ci]"
          file_pattern: "latest_decision.json *.pt KB_*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: main
