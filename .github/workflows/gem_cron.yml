name: GEM Engine Cron Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy requests pydantic truststore

      - name: Execute Master Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          BIGGIS_API_KEY: ${{ secrets.BIGGIS_API_KEY }}
        run: python main_orchestrator.py

      - name: Commit & Push SSOT Outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync SSOT latest_decision [skip ci]"
          file_pattern: "latest_decision.json KB_20260904_ESE_OVERTOPPING.json"
          branch: main
