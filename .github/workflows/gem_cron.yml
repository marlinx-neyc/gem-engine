name: GEM Engine Autonomous Cron Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘自動執行一次解算

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 賦予寫入權限以 commit latest_decision.json

    steps:
      - name: 檢出最新程式碼
        uses: actions/checkout@v4

      - name: 配置 Python 3.10 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要 AI 與海象計算套件
        run: |
          pip install pydantic torch numpy gymnasium requests

      - name: 執行中央協調器產出 latest_decision.json
        run: |
          python main_orchestrator.py --single-run

      - name: Commit 並 Push latest_decision.json 回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_decision.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update latest_decision.json [skip ci]" && git push)
