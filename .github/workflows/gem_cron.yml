name: GEM Engine Autonomous Cron Workflow

on:
  workflow_dispatch:
  schedule:
    # 預設每 4 小時執行一次，可依需求調整
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pydantic
          
      - name: Run Main Pipeline (Generate JSON)
        # 關鍵修正：將執行檔改為 main.py
        run: |
          python main.py
          
      - name: Commit and Push latest_decision.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_decision.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto update latest_decision.json [skip ci]"
            git pull origin main --rebase
            git push origin main
          else
            echo "No changes to commit"
          fi
