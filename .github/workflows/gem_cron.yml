name: GEM Engine Cron Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 剛性授權寫入 Repository contents

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整抓取 Commit 歷史，防範 branch diverged

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy requests pydantic truststore

      - name: Execute Master Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          BIGGIS_API_KEY: ${{ secrets.BIGGIS_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main_orchestrator.py

      - name: Commit & Push SSOT Outputs & Model Weights
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 加入需要同步的檔案
          git add *.json *.html *.pt
          
          # 僅在有檔案變更時提交並 Push
          if ! git diff --staged --quiet; then
            git commit -m "auto: sync SSOT & update latest model weights [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "無檔案變更，跳過 Commit"
          fi
