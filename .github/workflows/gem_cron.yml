name: GEM Engine Cron Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # 擴充：允許外部 Webhook 脈衝觸發，徹底解決 GitHub Cron 延遲
  repository_dispatch:
    types: [ trigger_gem_engine ]

# 避免多個 Run 同時執行導致 Git Push 衝突
concurrency:
  group: gem-engine-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 啟用套件快取，降低執行時間

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy requests pydantic truststore

      - name: Execute Master Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          BIGGIS_API_KEY: ${{ secrets.BIGGIS_API_KEY }}
        run: python main_orchestrator.py

      - name: Commit & Push SSOT Outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync SSOT latest_decision [skip ci]"
          file_pattern: "*.json *.html"
          branch: main
