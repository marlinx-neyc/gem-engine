name: GEM Engine Autonomous Cron Workflow

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy requests pydantic truststore

      - name: Execute Master Orchestrator Pipeline
        run: |
          python main_orchestrator.py

      - name: Commit and Push SSOT Decision Payload
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add latest_decision.json dashboard.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update SSOT decision payload [skip ci]" && git push)
