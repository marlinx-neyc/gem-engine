name: 24H Marine AI Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic numpy gymnasium

      - name: Run AI Orchestrator Pipeline
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          python main_orchestrator.py --single-run
