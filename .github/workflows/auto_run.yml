name: 24H Marine AI Orchestrator

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間 08:00) 自動執行
  workflow_dispatch:     # 保留 UI 手動觸發按鈕
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 開啟 pip 快取，解決 torch 每次重裝過久的問題

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Orchestrator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 若有 API Key 等Secrets可綁定於此
        run: |
          python main_orchestrator.py # 請填入你的主要執行檔名
